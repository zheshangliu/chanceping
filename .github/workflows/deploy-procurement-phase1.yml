name: Deploy procurement Phase 1

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Immutable procurement phase1 rollout tag
        required: true
        default: release-procurement-phase1-2b-20260913-f514ee6
        type: string

permissions:
  contents: read

concurrency:
  group: chanceping-production
  cancel-in-progress: false

jobs:
  candidate-verify:
    name: Verify immutable procurement candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Restrict rollout to exact procurement candidate
        env:
          CHANCEPING_DEPLOY_REF: ${{ inputs.git_ref }}
          CHANCEPING_PROCUREMENT_TAG: release-procurement-phase1-2b-20260913-f514ee6
        run: |
          if [ "${CHANCEPING_DEPLOY_REF}" != "${CHANCEPING_PROCUREMENT_TAG}" ]; then
            echo "Unsupported deployment reference: ${CHANCEPING_DEPLOY_REF}" >&2
            exit 2
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run verify:v15:e2e
      - run: npm run verify:v15
      - run: npm run verify:v16
      - run: npm run verify:all
      - run: npm run verify:ich:v211
      - run: npm run verify:ich:procurement:semantic

  control-plane-verify:
    name: Verify procurement control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run verify:procurement:phase1:rollout-control

  deploy:
    name: SWAS transactional rollout
    needs: [candidate-verify, control-plane-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production
      url: https://www.chanceping.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install isolated Alibaba Cloud SDK
        run: npm install --prefix "$RUNNER_TEMP/chanceping-swas-sdk" --no-audit --no-fund @alicloud/swas-open20200601 @alicloud/openapi-client @alicloud/tea-util

      - name: Run procurement phase 1 transactional rollout
        env:
          NODE_PATH: ${{ runner.temp }}/chanceping-swas-sdk/node_modules
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          CHANCEPING_SWAS_INSTANCE: ${{ secrets.CHANCEPING_SWAS_INSTANCE }}
          CHANCEPING_SWAS_REGION: ${{ vars.CHANCEPING_SWAS_REGION }}
          CHANCEPING_DEPLOY_REF: ${{ inputs.git_ref }}
          CHANCEPING_SERVER_REPO_DIR: /opt/chanceping
        run: node scripts/invoke-aliyun-swas-procurement-phase1.cjs

      - name: Verify public production paths
        env:
          CHANCEPING_DEPLOY_BASE_URL: https://www.chanceping.com
          NODE_OPTIONS: --tls-max-v1.2
        run: npm ci --no-audit --no-fund && npm run verify:q7:aliyun-remote-smoke
