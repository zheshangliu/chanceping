# ChancePing Docker Compose - 本地模拟阿里云 MVP 容器
# 默认 mock-safe；需要真实 Qwen / Serper 时通过环境变量注入，不挂载 api.env。
#
# 用法：
#   docker-compose up -d          # 后台启动
#   docker-compose logs -f        # 查看日志
#   docker-compose down           # 停止
#
# 浏览器打开 http://localhost:3000

version: "3.8"

services:
  chanceping:
    build:
      context: .
      args:
        NODE_IMAGE: ${CHANCEPING_DOCKER_NODE_IMAGE:-node:22-slim}
    image: chanceping:latest
    container_name: chanceping
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_MODE=mock
      - LLM_MODE=mock
      - CHANCEPING_LLM_PROFILE=contest
      - CONTEST_LLM_PROVIDER=qwen
      - CHANCEPING_LOAD_API_ENV=false
      - CHANCEPING_ENABLE_LOCAL_LIVE_SEARCH=false
      - CHANCEPING_ENABLE_LOCAL_LIVE_LLM=false
      - STORE_TYPE=local
      - SCHEDULER_ENABLED=false
      - NOTIFY_MOCK_MODE=true
      - PDF_EXPORT_ENABLED=false
      - CHANCEPING_RADAR_CHAT_STORE_PATH=data/radar-chat-windows.json
      # 如需使用真实 Qwen / Serper，请在部署平台注入，不要写入 compose 文件：
      # - LLM_MODE=live
      # - CONTEST_LLM_MODEL=${CONTEST_LLM_MODEL}
      # - CONTEST_LLM_BASE_URL=${CONTEST_LLM_BASE_URL}
      # - CONTEST_LLM_API_KEY=${CONTEST_LLM_API_KEY}
      # - SERPER_API_KEY=${SERPER_API_KEY}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./exports:/app/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：Meilisearch 全文搜索（如需启用，将 STORE_TYPE 改为 meili）
